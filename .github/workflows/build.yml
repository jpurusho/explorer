name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  skip-if-tagged:
    name: Check for release tag
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/${{ github.repository }}/git/matching-refs/tags/v \
            --jq '.[] | select(.object.sha == "${{ github.sha }}") | .ref' 2>/dev/null | head -1)
          if [ -n "$TAG" ]; then
            echo "Skipping: commit ${{ github.sha }} has release tag $TAG"
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: skip-if-tagged
    if: needs.skip-if-tagged.outputs.should_skip != 'true'
    name: Type Check & Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

  build:
    name: Build macOS App
    runs-on: macos-latest
    needs: [skip-if-tagged, check]
    if: needs.skip-if-tagged.outputs.should_skip != 'true'
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target ${{ matrix.target }}

      - name: Zip app bundle
        run: cd src-tauri/target/${{ matrix.target }}/release/bundle/macos && zip -r Explorer.zip Explorer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Explorer-${{ matrix.target }}.zip
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Explorer.zip
          if-no-files-found: error
